[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
version = "1.0.0"
description = "Context-Aware Plugin Router, In-Process Context Pruner & SQLite Breadcrumb Store for Claude Code"
authors = [{ name = "Sai Reddy" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.6.0",
    "rapidfuzz>=3.6.0",
    "mcp>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
ultron = "ultron.cli:main"
